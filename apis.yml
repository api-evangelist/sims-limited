name: Sims Limited

description: Sims Limited is an ASX-listed global recycling company whose story began in 1917 with a single scrap metal yard in Sydney, Australia. The parent company took the name Sims Limited in 2020 to reflect the breadth of its businesses, including Sims Metal and Sims Lifecycle Services, which extend the life of discarded goods through advanced recycling and repurposing. Its stated purpose is to 'create a world without waste to preserve our planet'. Surfaced via the API Evangelist harvest backlog (australia-apidays-2026); its corporate site publishes no developer portal, API documentation or public API.

